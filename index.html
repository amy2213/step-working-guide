<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6">
  <meta name="description" content="Interactive, source-verified Twelve Step Working Guide with local autosave and 460 reflections.">
  <title>Interactive Step Working Guide</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-wrap">
        <div class="kicker">Interactive Step Working Guide</div>
        <div id="brandStep" class="brand">Step One</div>
      </div>
      <div class="top-actions" aria-label="Workbook actions">
        <button id="privacyBtn" class="ghost-btn" type="button" aria-pressed="false">Hide responses</button>
        <button id="exportBtn" class="ghost-btn" type="button">Export answers</button>
        <label class="ghost-btn import-label" for="importFile">Import answers</label>
        <input id="importFile" class="sr-only" type="file" accept="application/json,.json">
        <button id="printBtn" class="ghost-btn" type="button">Print / PDF</button>
        <a class="ghost-btn link-btn" href="release.html">Release info</a>
      </div>
    </div>

    <nav id="stepNav" class="step-nav" aria-label="Step navigation"></nav>

    <div class="progress-shell" aria-label="Workbook progress">
      <div class="progress-row">
        <span id="progressText">0 of 0 reflections answered in this step</span>
        <span id="overallProgressText">0 of 460 overall</span>
      </div>
      <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progressFill"></div>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <article id="workbook" class="workbook" aria-live="polite"></article>
  </main>

  <footer class="footer">
    <div>
      <strong>Private by default.</strong> Answers save only in this browser on this device unless you export them.
    </div>
    <div class="footer-actions">
      <button id="prevBtn" type="button" class="text-btn">Previous step</button>
      <button id="clearBtn" type="button" class="text-btn danger">Clear this step</button>
      <button id="nextBtn" type="button" class="text-btn">Next step</button>
    </div>
  </footer>

  <script src="archive/browser-prototype/data/step-2.js"></script>
  <script src="archive/browser-prototype/data/step-3.js"></script>
  <script src="archive/browser-prototype/data/step-4.js"></script>
  <script src="archive/browser-prototype/data/step-7.js"></script>
  <script src="archive/browser-prototype/data/final-source-fixes.js"></script>
  <script src="data/step-1.js"></script>
  <script src="data/step-5.js"></script>
  <script src="data/step-6.js"></script>
  <script src="data/step-8.js"></script>
  <script src="data/step-9-part-1.js"></script>
  <script src="data/step-9-part-2.js"></script>
  <script src="data/step-9-part-3.js"></script>
  <script src="data/step-9-part-4.js"></script>
  <script src="data/step-10-part-1.js"></script>
  <script src="data/step-10-part-2.js"></script>
  <script src="data/step-10-part-3.js"></script>
  <script src="data/step-11-part-1.js"></script>
  <script src="data/step-11-part-2.js"></script>
  <script src="data/step-11-part-3.js"></script>
  <script src="data/step-12-part-1.js"></script>
  <script src="data/step-12-part-2.js"></script>
  <script src="data/step-12-part-3.js"></script>
  <script src="data/bootstrap.js"></script>
  <script src="app.js"></script>
</body>
</html>
