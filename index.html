<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <title>Step Working Guide</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="kicker">Interactive Step Working Guide</div>
        <div id="brandStep" class="brand">Step One</div>
      </div>
      <div class="top-actions">
        <button id="privacyBtn" class="ghost-btn" type="button">Hide responses</button>
        <button id="printBtn" class="ghost-btn" type="button">Print / PDF</button>
      </div>
    </div>
    <nav class="step-nav" aria-label="Step navigation">
      <button class="step-tab active" type="button" data-step="1">Step One</button>
      <button class="step-tab" type="button" data-step="2">Step Two</button>
      <button class="step-tab" type="button" data-step="3">Step Three</button>
    </nav>
    <div class="progress-shell" aria-label="Step progress">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <div id="progressText" class="progress-text">0 of 0 reflections answered</div>
    </div>
  </header>

  <main class="page-shell">
    <article id="workbook" class="workbook" aria-live="polite"></article>
  </main>

  <footer class="footer">
    <span>Responses save automatically on this device.</span>
    <button id="clearBtn" type="button" class="text-btn">Clear saved responses for this step</button>
  </footer>

  <script src="data/step-1.js"></script>
  <script src="data/step-2.js"></script>
  <script src="data/step-3.js"></script>
  <script src="app.js"></script>
</body>
</html>
